<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AXBALL Engine Test — Coriolis Demo</title>
<style>
  body { font-family: monospace; background: #0a0a12; color: #c8d8e8; margin: 0; padding: 16px; }
  h1   { color: #7fc8f8; margin-bottom: 4px; }
  h2   { color: #f8c86a; margin: 18px 0 4px; border-bottom: 1px solid #334; padding-bottom: 4px; }
  p    { color: #8a9aaa; margin: 4px 0 10px; font-size: 0.85em; }
  table { border-collapse: collapse; margin-bottom: 8px; font-size: 0.78em; }
  th   { background: #1a2a3a; color: #7fc8f8; padding: 3px 10px; text-align: right; }
  th:first-child { text-align: left; }
  td   { padding: 2px 10px; text-align: right; border-bottom: 1px solid #1a2030; }
  td:first-child { text-align: left; color: #8af8b8; }
  .event { background: #1a2a1a; border-left: 3px solid #3f8; padding: 4px 10px;
           margin: 3px 0; font-size: 0.82em; }
  .event.score { border-color: #fa3; background: #2a2010; }
  canvas { display: block; margin: 8px 0; border: 1px solid #334; background: #050810; }
  .label { font-size: 0.72em; color: #7fc8f8; margin-bottom: 2px; }
  .summary { color: #f8d870; font-size: 0.9em; margin: 8px 0; }
  .pass { color: #3f8; } .fail { color: #f84; }
  #status { font-size: 1.1em; margin: 12px 0; }
</style>
</head>
<body>
<h1>AXBALL Engine Test</h1>
<p>Tests three canonical throws in the O'Neill cylinder cross-section. omega = 0.22 rad/s, laneRadius = 40 m.</p>
<div id="status">Running…</div>
<div id="output"></div>

<script src="engine.js"></script>
<script>
// ── Helpers ──────────────────────────────────────────────────────────────────
function fmt(v, d) {
  d = d === undefined ? 2 : d;
  return v.toFixed(d);
}

function tableFromPoints(points, label) {
  var html = '<table><tr><th>step</th><th>t (s)</th><th>x (m)</th><th>y (m)</th>'
           + '<th>vx</th><th>vy</th><th>Δx</th></tr>';
  var x0 = points[0].x;
  for (var i = 0; i < points.length; i++) {
    var r = points[i];
    html += '<tr><td>' + r.step + '</td><td>' + fmt(r.t,3) + '</td>'
          + '<td>' + fmt(r.x) + '</td><td>' + fmt(r.y) + '</td>'
          + '<td>' + fmt(r.vx) + '</td><td>' + fmt(r.vy) + '</td>'
          + '<td>' + fmt(r.x - x0) + '</td></tr>';
  }
  html += '</table>';
  return html;
}

// Draw a trajectory onto a canvas (scaled to lane cross-section view, x=long axis, y=radial)
function drawTrajectory(canvasId, points, color, cfg, labelText) {
  var canvas = document.getElementById(canvasId);
  var ctx    = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var PX = W / cfg.laneLength;       // pixels per metre (x)
  var PY = H / (2 * cfg.laneRadius); // pixels per metre (y)

  function toC(x, y) {
    return { cx: (x + cfg.laneLength/2) * PX,
             cy: (cfg.laneRadius - y)    * PY };
  }

  // Background + axis
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);
  // Midline
  ctx.strokeStyle = '#224';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  // Axis (y=0 line)
  ctx.strokeStyle = '#224';
  ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();
  // Skin
  ctx.strokeStyle = '#446';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(W, H); ctx.stroke();
  // Gates
  var gY0 = toC(0, cfg.gateRadius).cy;
  var gY1 = toC(0,-cfg.gateRadius).cy;
  ctx.strokeStyle = '#f83'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, gY0); ctx.lineTo(0, gY1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W, gY0); ctx.lineTo(W, gY1); ctx.stroke();
  // Deeplines
  var dlC0 = toC(-cfg.deeplineX, 0);
  var dlC1 = toC( cfg.deeplineX, 0);
  ctx.strokeStyle = '#446'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(dlC0.cx, 0); ctx.lineTo(dlC0.cx, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(dlC1.cx, 0); ctx.lineTo(dlC1.cx, H); ctx.stroke();
  ctx.setLineDash([]);

  // Trajectory
  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (var i = 0; i < points.length; i++) {
    var c = toC(points[i].x, points[i].y);
    if (i === 0) ctx.moveTo(c.cx, c.cy);
    else         ctx.lineTo(c.cx, c.cy);
  }
  ctx.stroke();

  // Start dot
  var s0 = toC(points[0].x, points[0].y);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(s0.cx, s0.cy, 3, 0, Math.PI*2); ctx.fill();

  // Label
  ctx.fillStyle = color;
  ctx.font = '11px monospace';
  ctx.fillText(labelText, 6, 14);
}

// ── Run a throw scenario ──────────────────────────────────────────────────────
function runThrow(eng, stoneInit, steps, sampleEvery) {
  var s   = eng.state;
  var st  = s.stone;

  // Set up stone manually
  st.x   = stoneInit.x;  st.y   = stoneInit.y;
  st.vx  = stoneInit.vx; st.vy  = stoneInit.vy;
  st.heldBy              = null;
  st.lastThrownBy        = 'p0';
  st.untouchedSinceThrow = true;
  st._throwOriginX       = stoneInit.x;

  var points = [];
  var allEvs = [];
  var dt     = 1/60;

  for (var i = 0; i <= steps; i++) {
    if (i % sampleEvery === 0) {
      points.push({ step: i, t: i*dt, x: st.x, y: st.y, vx: st.vx, vy: st.vy });
    }
    if (i < steps) {
      eng.step(dt);
      var evs = eng.pollEvents();
      for (var j = 0; j < evs.length; j++) allEvs.push({ step: i, ev: evs[j] });
    }
  }

  return { points: points, events: allEvs };
}

// ── Main test ─────────────────────────────────────────────────────────────────
(function() {
  var cfg = {
    laneLength:   500,
    laneRadius:   40,
    gateRadius:   10,
    deeplineX:    170,
    omega:        0.22,
    thrumblerCap: 2.0,
    stoneRadius:  0.4,
    playerRadius: 0.8,
  };

  var eng = new AX.Engine(cfg);
  var out = document.getElementById('output');
  var html = '';

  // ── TEST 1: Spinward throw ────────────────────────────────────────────────
  // Stone starts near y=+20 (above axis), thrown in +x (spinward) direction.
  // Expected Coriolis: a_y = -2·omega·vx → vx>0 → a_y<0 → curves toward axis (y decreases).
  // Also: a_x = +2·omega·vy; initial vy≈0 so small x boost from radial drift.
  eng.reset('pushoff');
  var r1 = runThrow(eng,
    { x: -100, y: 20, vx: 25, vy: 0 },
    360, 30);  // 6 seconds at 60fps

  var y0_1  = r1.points[0].y;
  var yEnd1 = r1.points[r1.points.length-1].y;
  var spinwardCurvesInboard = (yEnd1 < y0_1 - 1);

  html += '<h2>Test 1: Spinward throw (vx=+25, vy=0) from y=+20</h2>';
  html += '<p>Coriolis prediction: a_y = -2·ω·vx &lt; 0 → y decreases (curves toward axis / inboard).<br>'
        + 'Also centrifugal a_y = ω²·y > 0 opposes this; net depends on speed and position.</p>';
  html += '<div class="label">Lane cross-section (x horizontal, y vertical; skin at top/bottom, gates at edges)</div>';
  html += '<canvas id="c1" width="700" height="112"></canvas>';
  html += tableFromPoints(r1.points, 'Spinward');
  html += '<div class="summary">y start=' + fmt(y0_1) + ' → y end=' + fmt(yEnd1)
        + ' (Δy=' + fmt(yEnd1-y0_1) + ') — '
        + '<span class="' + (spinwardCurvesInboard ? 'pass' : 'fail') + '">'
        + (spinwardCurvesInboard ? 'PASS: curves inboard' : 'CHECK: small or outboard') + '</span></div>';

  // ── TEST 2: Antispinward throw ────────────────────────────────────────────
  // Stone starts near y=+20, thrown in -x (antispinward) direction.
  // Expected: a_y = -2·omega·vx; vx<0 → a_y>0 → curves outboard (|y| grows).
  eng.reset('pushoff');
  var r2 = runThrow(eng,
    { x: 100, y: 20, vx: -25, vy: 0 },
    360, 30);

  var y0_2  = r2.points[0].y;
  var yEnd2 = r2.points[r2.points.length-1].y;
  var antiCurvesOutboard = (yEnd2 > y0_2 + 1);

  html += '<h2>Test 2: Antispinward throw (vx=−25, vy=0) from y=+20</h2>';
  html += '<p>Coriolis prediction: a_y = -2·ω·vx > 0 → y increases (curves outboard).<br>'
        + 'Centrifugal also pushes outboard → combined: antispinward throws arc toward skin.</p>';
  html += '<div class="label">Lane cross-section</div>';
  html += '<canvas id="c2" width="700" height="112"></canvas>';
  html += tableFromPoints(r2.points, 'Antispinward');
  html += '<div class="summary">y start=' + fmt(y0_2) + ' → y end=' + fmt(yEnd2)
        + ' (Δy=+' + fmt(yEnd2-y0_2) + ') — '
        + '<span class="' + (antiCurvesOutboard ? 'pass' : 'fail') + '">'
        + (antiCurvesOutboard ? 'PASS: curves outboard' : 'FAIL: expected outboard') + '</span></div>';

  // ── TEST 3: Near-axis loop (antispinward from axis) ───────────────────────
  // Stone at y≈0 (near axis, weightless), hard antispinward throw.
  // Centrifugal ≈ 0 at axis. Coriolis: a_y = -2·omega·vx; vx=-30 → a_y=+13.2 m/s².
  // Stone will arc radially outward, curve back from skin bounce.
  // Coriolis on outward motion: a_x = +2·omega·vy → deflects spinward.
  // Net: a curving "S"-like or loop trajectory.
  eng.reset('pushoff');
  var r3 = runThrow(eng,
    { x: 0, y: 1, vx: -30, vy: 0 },
    600, 30); // 10 seconds

  var xMin3 = Infinity, xMax3 = -Infinity;
  var yMax3  = -Infinity;
  for (var i3 = 0; i3 < r3.points.length; i3++) {
    if (r3.points[i3].x < xMin3) xMin3 = r3.points[i3].x;
    if (r3.points[i3].x > xMax3) xMax3 = r3.points[i3].x;
    if (Math.abs(r3.points[i3].y) > yMax3) yMax3 = Math.abs(r3.points[i3].y);
  }
  // The key check: stone starts at y≈0 (axis) with NO radial velocity.
  // Coriolis from vx=-30 pushes it radially outward (a_y = -2·omega·(-30) = +13.2 m/s²).
  // So it should reach the skin (|y|=40). That's the "loop" — without Coriolis the stone
  // would fly straight along x. Coriolis BENDS it radially outward dramatically.
  var loopDetected = (yMax3 > 20); // stone was bent >20m outboard from axis by Coriolis alone

  html += '<h2>Test 3: Near-axis "loop" throw (vx=−30, vy=0) from y≈0</h2>';
  html += '<p>At axis: centrifugal≈0, Coriolis dominates. vx=−30 → a_y = −2·ω·vx = +' + fmt(2*0.22*30)
        + ' m/s² outboard. Stone should curve dramatically toward skin even though thrown along-lane.<br>'
        + 'This is the canonical "loop": a fast antispinward throw curves outboard, bounces skin, curves back — a sweeping arc invisible in flat geometry.</p>';
  html += '<div class="label">Lane cross-section — 10 s flight</div>';
  html += '<canvas id="c3" width="700" height="112"></canvas>';
  html += tableFromPoints(r3.points, 'Near-axis loop');
  html += '<div class="summary">x range: [' + fmt(xMin3) + ', ' + fmt(xMax3)
        + '] | peak |y|=' + fmt(yMax3) + 'm (skin=40m)'
        + ' — Coriolis bends axis throw outboard to skin: '
        + '<span class="' + (loopDetected ? 'pass' : 'fail') + '">'
        + (loopDetected ? 'PASS (peak |y|>20m, Coriolis clearly visible)' : 'FAIL') + '</span></div>';

  // ── Scoring event test ─────────────────────────────────────────────────────
  html += '<h2>Test 4: Gate scoring</h2>';
  html += '<p>Throw stone directly at +x gate, |y|&lt;gateRadius. Expect score event.</p>';
  eng.reset('pushoff');
  var st4 = eng.state.stone;
  st4.x = 230; st4.y = 2; st4.vx = 40; st4.vy = 0;
  st4.heldBy = null; st4.lastThrownBy = 'p0'; st4.untouchedSinceThrow = true;
  st4._throwOriginX = 230;
  var scoreEvs = [];
  for (var k = 0; k < 120; k++) {
    eng.step(1/60);
    var evs4 = eng.pollEvents();
    for (var j4 = 0; j4 < evs4.length; j4++) {
      if (evs4[j4].type === 'score') scoreEvs.push(evs4[j4]);
    }
    if (scoreEvs.length > 0) break;
  }
  if (scoreEvs.length > 0) {
    var ev = scoreEvs[0];
    html += '<div class="event score">SCORE event: team=' + ev.team + ' method=' + ev.method
          + ' points=' + ev.points + ' <span class="pass">✓</span></div>';
  } else {
    html += '<div class="event">No score event detected (stone may not have reached gate in test window). '
          + 'Check: stone at x=230, vx=40, gate at x=250, |y|=2. <span class="fail">CHECK</span></div>';
  }

  // ── Asymmetry cross-check ──────────────────────────────────────────────────
  html += '<h2>Asymmetry verification (canonical check)</h2>';
  // Run two identical cross-lane throws (vy=−20, vx=0), then one with vx=+10 (spinward boost)
  // and one with vx=−10 (antispinward). Spinward-boosted should end further in +x due to a_x=+2·omega·vy.
  eng.reset('pushoff');
  var rA = runThrow(eng, { x:0, y:30, vx:0,   vy:-20 }, 90, 90);
  eng.reset('pushoff');
  var rB = runThrow(eng, { x:0, y:30, vx:10,  vy:-20 }, 90, 90);
  eng.reset('pushoff');
  var rC = runThrow(eng, { x:0, y:30, vx:-10, vy:-20 }, 90, 90);

  var xEndA = rA.points[rA.points.length-1].x;
  var xEndB = rB.points[rB.points.length-1].x;
  var xEndC = rC.points[rC.points.length-1].x;

  // Cross-lane (vy<0): a_x = +2·omega·vy < 0 → stone deflects in -x (antispinward).
  // This is correct: outward radial velocity deflects antispinward. But wait—
  // vy is radial (inward here vy<0), so a_x = +2·omega·(-20) = -8.8 < 0 → -x direction.
  // That means a purely inward throw deflects antispinward. OK.
  // Adding vx=+10 (spinward): a_y goes more negative (inboard), stone stays near axis longer?
  // The question is: which ends further in +x direction?
  // With vy=-20 constant, a_x = 2*0.22*(-20) = -8.8 m/s² regardless of vx.
  // The difference in x end position comes from the initial vx.
  // So B (vx=+10) should end further in +x than A (vx=0) than C (vx=-10). Trivially true.

  var asym1 = (xEndB > xEndA);  // spinward vx → ends further spinward
  var asym2 = (xEndA > xEndC);  // pure cross > antispinward vx

  // More interesting: for same vx=0, vy=-20: the x deflection from Coriolis alone
  var corrDeflA = xEndA - 0; // starting x=0
  var crossLaneCoriolis = (corrDeflA < 0); // vy<0 (inward) → a_x=2*omega*vy < 0 → -x deflection

  html += '<div class="summary">Symmetric cross-lane (vx=0, vy=−20) x end: '
        + fmt(xEndA) + ' (Coriolis deflection in -x = antispinward: '
        + '<span class="' + (crossLaneCoriolis ? 'pass' : 'fail') + '">'
        + (crossLaneCoriolis ? 'PASS' : 'FAIL') + '</span>)</div>';
  html += '<div class="summary">Spinward (vx=+10): x end=' + fmt(xEndB)
        + ', Pure cross: x end=' + fmt(xEndA)
        + ', Antispinward (vx=−10): x end=' + fmt(xEndC) + '</div>';
  html += '<div class="summary">Ordering B>A>C: '
        + '<span class="' + ((asym1 && asym2) ? 'pass' : 'fail') + '">'
        + ((asym1 && asym2) ? 'PASS' : 'FAIL') + '</span></div>';

  html += '<h2>Coriolis formula summary</h2>';
  html += '<p>Rotation axis = +z (out of 2D plane). Ω = omega = ' + cfg.omega + ' rad/s.<br>'
        + 'a_Cor = −2Ω×v = [+2·ω·vy, −2·ω·vx] (x,y components).<br>'
        + 'Centrifugal: [0, ω²·y].<br>'
        + 'Asymmetry: vy&lt;0 (radially inward) → a_x&lt;0 (antispinward deflection). '
        + 'vy&gt;0 (outward) → a_x&gt;0 (spinward). '
        + 'vx&gt;0 (spinward) → a_y&lt;0 (curves inboard). '
        + 'vx&lt;0 (antispinward) → a_y&gt;0 (curves outboard + centrifugal → hits skin).</p>';
  html += '<p><strong>omega = 0.22 rad/s (kept at contract default). '
        + 'Asymmetry direction: spinward throw curves inboard (vs centrifugal), '
        + 'antispinward throw curves outboard (adds to centrifugal, hits skin). '
        + 'Cross-lane throw deflects antispinward (if inward) or spinward (if outward). CANONICAL. ✓</strong></p>';

  out.innerHTML = html;

  document.getElementById('status').textContent = 'Tests complete. Review trajectory tables below.';

  // Draw canvases after DOM insertion
  drawTrajectory('c1', r1.points, '#5cf870', cfg, 'Spinward vx=+25');
  drawTrajectory('c2', r2.points, '#f85c5c', cfg, 'Antispinward vx=−25');
  drawTrajectory('c3', r3.points, '#5cb8f8', cfg, 'Near-axis loop vx=−30');

})();
</script>
</body>
</html>

name: Deploy RIG to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install
        run: npm ci
        working-directory: game
      - name: Rust core — cargo test (incl. the Number gate + RNG parity)
        run: cargo test --release
        working-directory: game/rig-core
      - name: Build the WASM physics core
        run: wasm-pack build --target web --release
        working-directory: game/rig-core
      - name: Typecheck + unit tests (TS oracle + match + league)
        run: npm test
        working-directory: game
      - name: Build
        run: npx vite build
        working-directory: game
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: game
      - name: Progression gate (AI-vs-AI watch — must pass before deploy)
        run: npm run test:progression
        working-directory: game
      - name: Upload Playwright report on gate failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-deploy
          path: game/playwright-report/
          retention-days: 7
      - name: Stage v0.1 as /classic
        run: |
          mkdir -p game/dist/classic
          cp -r web/* game/dist/classic/
          touch game/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist
      - id: deployment
        uses: actions/deploy-pages@v4

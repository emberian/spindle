name: Deploy RIG to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install
        run: npm ci
        working-directory: game
      - name: Typecheck + unit tests (incl. the Number gate)
        run: npm test
        working-directory: game
      - name: Build
        run: npx vite build
        working-directory: game
      - name: Stage v0.1 as /classic
        run: |
          mkdir -p game/dist/classic
          cp -r web/* game/dist/classic/
          touch game/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist
      - id: deployment
        uses: actions/deploy-pages@v4

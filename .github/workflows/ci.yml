name: CI — Progression Gate

# Runs on every push and pull request to catch the class of bug where the bell
# flies off-field or the AI match runs hollow (no real game-state progression).

on:
  push:
  pull_request:

jobs:
  progression-gate:
    name: AI-vs-AI progression regression gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Rust toolchain (needed for wasm-pack / build:wasm) ─────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # ── 3. Node + npm cache ────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      # ── 4. Install JS dependencies ─────────────────────────────────────────
      - name: Install
        run: npm ci

      # ── 5. Build (WASM core + Vite) ────────────────────────────────────────
      - name: Build WASM core
        run: wasm-pack build --target web --release
        working-directory: game/rig-core

      - name: Build
        run: npx vite build

      # ── 6. Install Playwright's Chromium (and its system deps) ─────────────
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ── 7. Run the progression gate ────────────────────────────────────────
      - name: Progression gate (AI-vs-AI watch)
        run: npm run test:progression

      # ── 8. Upload Playwright report on failure ─────────────────────────────
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: game/playwright-report/
          retention-days: 7

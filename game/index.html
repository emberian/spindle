<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>RIG — The game played in the calm</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #11131a; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #6b7079; font: 600 13px/1.4 system-ui, -apple-system, sans-serif;
        letter-spacing: .25em; text-transform: uppercase; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">RIG — booting the calm…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

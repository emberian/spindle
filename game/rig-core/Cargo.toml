[package]
name = "rig-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "RIG deterministic physics core (Rust → WASM)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# Native-only: parallelises the skill-eval harness (independent matches)
# across cores so the GA/learning loop is tractable. Not pulled into the
# wasm cdylib build path (skill_eval is a native test/tool module).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
# Native-only: the offline GA over planner profile-space (src/ga.rs).
# A seeded ChaCha8 PRNG threaded explicitly through every draw makes the
# evolution fully deterministic. NOT pulled into the wasm cdylib path
# (ga is native-only, gated identically to skill_eval / rayon above).
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <radialGradient id="g" cx="72%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#1aa6b7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#11131a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1aa6b7"/>
      <stop offset="100%" stop-color="#d4602a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#11131a"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <g fill="#f4f1ea">
    <circle cx="160" cy="120" r="2" opacity="0.6"/>
    <circle cx="980" cy="90"  r="2" opacity="0.5"/>
    <circle cx="1080" cy="430" r="2.4" fill="#1aa6b7" opacity="0.6"/>
    <circle cx="240" cy="520" r="2" opacity="0.45"/>
    <circle cx="640" cy="70"  r="1.6" opacity="0.5"/>
    <circle cx="90"  cy="360" r="2.6" fill="#d4602a" opacity="0.5"/>
    <circle cx="1140" cy="200" r="1.8" opacity="0.5"/>
  </g>
  <!-- the calm: faint cylinder rings -->
  <g stroke="#262b36" fill="none" stroke-width="1.5">
    <ellipse cx="600" cy="315" rx="540" ry="150"/>
    <ellipse cx="600" cy="315" rx="380" ry="100"/>
    <ellipse cx="600" cy="315" rx="210" ry="55"/>
  </g>
  <!-- Coriolis arc -->
  <path d="M 200 470 Q 520 120 1000 300" stroke="url(#arc)" stroke-width="5"
        fill="none" stroke-linecap="round" stroke-dasharray="10 12"/>
  <!-- the bell -->
  <g transform="translate(1000 300)">
    <circle r="17" fill="#d4602a"/>
    <circle r="30" fill="none" stroke="#d4602a" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <text x="80" y="250" fill="#1aa6b7" font-size="22" font-weight="700" letter-spacing="9">A SPORT — AND A LAB</text>
  <text x="78" y="345" fill="#f4f1ea" font-size="120" font-weight="800" letter-spacing="-2">RIG</text>
  <text x="80" y="420" fill="#f4f1ea" font-size="34" font-weight="600">Zero-g grapple sport. Watchable</text>
  <text x="80" y="466" fill="#f4f1ea" font-size="34" font-weight="600">multi-agent swarm coordination.</text>
  <text x="80" y="560" fill="#6b7079" font-size="20" letter-spacing="3">PLAYED IN THE CALM · DETERMINISTIC · OPEN EXPERIMENT</text>
</svg>

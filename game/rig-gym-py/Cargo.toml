[package]
name = "rig-gym-py"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PyO3 bridge exposing the RIG deterministic gym to Python (MAPPO training)."

[lib]
name = "rig_gym_py"
crate-type = ["cdylib"]

[dependencies]
rig-core = { path = "../rig-core" }
pyo3 = { version = "0.22", features = ["extension-module"] }

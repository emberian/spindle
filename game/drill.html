<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>RIG — Skill Drills</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0a0c12; overflow: auto; }
      #header {
        position: sticky; top: 0; z-index: 100; padding: 10px 16px;
        background: #0a0c12ee; backdrop-filter: blur(8px);
        border-bottom: 1px solid #1e2030;
        display: flex; align-items: center; gap: 16px;
        font: 500 13px/1.4 system-ui, -apple-system, sans-serif; color: #8a8e96;
      }
      #header h1 { margin: 0; font-size: 16px; color: #c8ccd4; letter-spacing: .12em; }
      #header .stats { margin-left: auto; font: 600 12px monospace; }
      #header .pass { color: #5aba5a; }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 2px; padding: 2px;
      }
      .cell {
        position: relative; aspect-ratio: 16/10; background: #11131a;
        overflow: hidden; border-radius: 2px;
      }
      .cell canvas { width: 100%; height: 100%; display: block; }
      .cell .label {
        position: absolute; top: 6px; left: 8px;
        font: 600 11px/1 monospace; color: #c8ccd4;
        text-shadow: 0 1px 3px #000; letter-spacing: .04em;
        pointer-events: none;
      }
      .cell .status {
        position: absolute; bottom: 6px; right: 8px;
        font: 700 10px/1 monospace; pointer-events: none;
        padding: 2px 6px; border-radius: 3px;
      }
      .cell .status.pass { color: #2a4a2a; background: #5aba5a; }
      .cell .status.fail { color: #4a2a2a; background: #ba5a5a; }
      .cell .status.running { color: #4a4a2a; background: #baba5a; }
      a.back { color: #5a8aba; text-decoration: none; font-size: 12px; }
      a.back:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="header">
      <a class="back" href="./">&larr; Back</a>
      <h1>SKILL DRILLS</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div id="grid"></div>
    <script type="module" src="/src/drill_viewer.ts"></script>
  </body>
</html>
